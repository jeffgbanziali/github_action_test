name: CI Tests

on: [push]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Lancer les tests unitaires
        run: pytest